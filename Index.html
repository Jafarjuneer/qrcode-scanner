<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eman Bakery — ZATCA Invoice Scanner</title>

<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap');

:root {
  --bg: #07090c; --s1: #0f1318; --s2: #161c24; --border: #1e2530;
  --green: #10b981; --gold: #f59e0b; --red: #ef4444; --blue: #3b82f6;
  --text: #f1f5f9; --muted: #64748b;
  --sans: 'Plus Jakarta Sans', sans-serif; --mono: 'IBM Plex Mono', monospace; --ar: 'Noto Naskh Arabic', serif;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; padding-bottom:40px; }

.hdr { background:var(--s1); border-bottom:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; backdrop-filter:blur(10px); }
.hdr-logo { display:flex; align-items:center; gap:10px; }
.hdr-ico { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,#10b981,#059669); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#000; }
.hdr-title { font-size:15px; font-weight:800; }
.hdr-sub { font-size:10px; color:var(--muted); font-family:var(--mono); }

.tabs { display:flex; gap:3px; background:var(--s1); border:1px solid var(--border); border-radius:12px; padding:3px; margin:14px 14px 0; }
.tab { flex:1; padding:10px 4px; border:none; background:transparent; color:var(--muted); font-weight:700; border-radius:9px; cursor:pointer; }
.tab.on { background:var(--s2); color:var(--text); box-shadow:0 1px 6px rgba(0,0,0,.5); }
.panel { display:none; padding:14px; }
.panel.on { display:block; }

/* Camera & Upload styles (same as before - abbreviated for brevity) */
.cam-wrap, .dropzone, .mbox { background:var(--s2); border:1px solid var(--border); border-radius:14px; }
.cam-view { position:relative; background:#000; width:100%; aspect-ratio:1; max-height:370px; overflow:hidden; }
#video { width:100%; height:100%; object-fit:cover; }
.idle { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; cursor:pointer; }
.btn { padding:11px 10px; border:none; border-radius:10px; font-weight:700; cursor:pointer; }
.g { background:var(--green); color:#000; }
.r { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:var(--red); }
.gh { background:var(--s2); border:1px solid var(--border); color:var(--text); }
.errbox { background:rgba(239,68,68,.07); border:1px solid rgba(239,68,68,.25); border-radius:10px; padding:12px 14px; color:var(--red); display:none; }
.errbox.on { display:block; }

/* HISTORY / EXPORT TAB - ENHANCED */
.filter-bar {
  background:var(--s2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; display:grid; gap:10px;
  grid-template-columns: 1fr 1fr; 
}
@media (max-width: 640px) { .filter-bar { grid-template-columns: 1fr; } }

.filter-bar input, .filter-bar select {
  background:var(--s1); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:10px; font-family:var(--mono);
}

.stbl { background:var(--s2); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.shdr {
  display:grid; grid-template-columns: 30px 110px 1fr 140px 110px 90px 90px 90px 80px 50px;
  padding:10px 12px; background:var(--s1); font-family:var(--mono); font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; gap:6px;
}
.srow {
  display:grid; grid-template-columns: 30px 110px 1fr 140px 110px 90px 90px 90px 80px 50px;
  padding:10px 12px; border-bottom:1px solid rgba(30,37,48,.5); gap:6px; align-items:center; cursor:pointer;
}
.srow:hover { background:rgba(16,185,129,.04); }
.srow:last-child { border-bottom:none; }
.sn { font-family:var(--mono); font-size:10px; color:var(--muted); }
.sdate, .sname, .svat, .snum { font-size:12px; }
.samt { font-family:var(--mono); font-size:11px; color:var(--gold); font-weight:700; }
.sdel { width:28px; height:28px; border-radius:6px; background:transparent; color:var(--red); border:1px solid transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.sdel:hover { background:rgba(239,68,68,.15); border-color:rgba(239,68,68,.4); }

.empty { padding:60px 20px; text-align:center; color:var(--muted); font-family:var(--mono); }

.exp-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.btn-go { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.3); color:var(--gold); }

.toast {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--s2); border:1px solid var(--green); color:var(--green);
  padding:10px 20px; border-radius:30px; font-family:var(--mono); font-size:13px;
  opacity:0; transition:.3s; z-index:999;
}
.toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">
    <div class="hdr-ico">EB</div>
    <div>
      <div class="hdr-title">ZATCA Scanner</div>
      <div class="hdr-sub">Eman Bakery — Invoice Management</div>
    </div>
  </div>
  <span class="hdr-badge" id="scan-badge">0 scans</span>
</div>

<div class="tabs">
  <button class="tab on" onclick="switchTab('cam',this)">📷 Camera</button>
  <button class="tab" onclick="switchTab('upl',this)">🖼 Upload</button>
  <button class="tab" onclick="switchTab('man',this)">✏️ Paste</button>
  <button class="tab" onclick="switchTab('exp',this)">📋 History</button>
</div>

<!-- CAMERA, UPLOAD, MANUAL panels remain the same as previous version (omitted for brevity - they are unchanged) -->
<!-- ... [Keep the entire camera, upload, manual sections from the previous full code] ... -->

<!-- HISTORY / EXPORT PANEL -->
<div class="panel" id="p-exp">
  <div class="filter-bar">
    <input type="text" id="filter-supplier" placeholder="Supplier Name..." onkeyup="filterTable()">
    <input type="text" id="filter-vat" placeholder="VAT Number..." onkeyup="filterTable()">
    <input type="date" id="filter-date-from" onchange="filterTable()">
    <input type="date" id="filter-date-to" onchange="filterTable()">
  </div>

  <div class="exp-actions">
    <button class="btn g" onclick="exportExcel()">⬇ Excel</button>
    <button class="btn go" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn gh" onclick="window.print()">🖨 Print / PDF</button>
    <button class="btn r" onclick="clearAllHistory()">🗑 Clear All</button>
  </div>

  <div class="stbl">
    <div class="shdr">
      <div>#</div>
      <div>Invoice Date</div>
      <div>Supplier Name</div>
      <div>Invoice Number</div>
      <div>Supplier Tax No.</div>
      <div>Amount Before Tax</div>
      <div>Tax Amount</div>
      <div>Total Incl. Tax</div>
      <div>Phase</div>
      <div></div>
    </div>
    <div id="history-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== STATE & CORE (unchanged from previous) ====================
const scans = JSON.parse(localStorage.getItem('z_scans') || '[]');
let stream = null, zxReader = null, cameras = [], camIdx = 0;

// ... [Keep all previous functions: switchTab, startCam, stopCam, processFile, deepScanImage, decodeTLV, etc.] ...

// Enhanced processQR with better field extraction
function processQR(raw, targetId) {
  const data = raw.trim();
  let fields = {}, name = 'ZATCA Invoice';

  const tlv = decodeTLV(data);
  if (tlv && Object.keys(tlv).length >= 3) {
    fields = { ...tlv };

    // Improved extraction
    const invoiceNo = data.match(/invoice(?:\s*no|#|number)[:\s]*([A-Z0-9-]+)/i) || 
                      fields['Seller Name']?.match(/INV-\d+/i) || ['',''];
    
    fields['Invoice Number'] = invoiceNo[1] || '';
    fields['Amount Before Tax'] = fields['Invoice Total (Incl. VAT)'] ? 
      (parseFloat(fields['Invoice Total (Incl. VAT)']) - parseFloat(fields['VAT Amount'] || 0)).toFixed(2) : '';

    // Duplicate check by Invoice Hash or full raw
    const isDuplicate = scans.some(s => 
      (s.fields && s.fields['Invoice Hash (SHA-256)'] && s.fields['Invoice Hash (SHA-256)'] === fields['Invoice Hash (SHA-256)']) ||
      s.raw === raw
    );

    if (isDuplicate) {
      toast('⚠️ Duplicate invoice detected! Already in history.');
      return; // Optional: still save or not? Here we skip saving duplicate
    }
  }

  // ... rest of original processQR logic with added fields ...

  const scan = {
    id: Date.now(),
    raw,
    ts: new Date().toISOString(),
    sellerName: fields['Seller Name'] || name,
    invoiceDate: fields['Invoice Date & Time'] || '',
    invoiceNo: fields['Invoice Number'] || '',
    vatNo: fields['VAT Registration Number'] || '',
    subtotal: fields['Amount Before Tax'] || '',
    vatAmt: fields['VAT Amount'] || '',
    total: fields['Invoice Total (Incl. VAT)'] || amt2num(fields['Invoice Total (Incl. VAT)'] || ''),
    phase: fields['ZATCA Phase'] || 'Phase 2',
    fields
  };

  scans.unshift(scan);
  if (scans.length > 500) scans.pop();
  save();
  updateBadge();
  if (targetId) renderCard(targetId, scan);
  toast('✓ Invoice added to history');
  if (document.getElementById('p-exp').classList.contains('on')) renderHistoryTable();
}

// ==================== HISTORY TABLE ====================
function renderHistoryTable(filteredScans = scans) {
  const body = document.getElementById('history-body');
  if (!filteredScans.length) {
    body.innerHTML = `<div class="empty">No invoices match your filter.<br>Scan more invoices.</div>`;
    return;
  }

  body.innerHTML = filteredScans.map((s, i) => {
    const ar = /[\u0600-\u06FF]/.test(s.sellerName);
    return `
      <div class="srow" onclick="viewScan(${s.id})">
        <div class="sn">${i+1}</div>
        <div class="sdate">${s.invoiceDate ? new Date(s.invoiceDate).toLocaleDateString('en-SA') : '—'}</div>
        <div class="sname ${ar?'ar':''}">${esc(s.sellerName)}</div>
        <div class="snum">${esc(s.invoiceNo || '—')}</div>
        <div class="svat">${esc(s.vatNo || '—')}</div>
        <div class="samt">${s.subtotal ? s.subtotal + ' SAR' : '—'}</div>
        <div class="samt">${s.vatAmt ? s.vatAmt + ' SAR' : '—'}</div>
        <div class="samt">${s.total ? s.total + ' SAR' : '—'}</div>
        <div style="font-size:10px;color:var(--muted);font-family:var(--mono)">${s.phase}</div>
        <button class="sdel" onclick="event.stopPropagation(); deleteScan(${s.id});">✕</button>
      </div>`;
  }).join('');
}

function filterTable() {
  const supplier = document.getElementById('filter-supplier').value.toLowerCase();
  const vat = document.getElementById('filter-vat').value.toLowerCase();
  const from = document.getElementById('filter-date-from').value;
  const to = document.getElementById('filter-date-to').value;

  const filtered = scans.filter(s => {
    const matchSupplier = !supplier || s.sellerName.toLowerCase().includes(supplier);
    const matchVat = !vat || (s.vatNo || '').toLowerCase().includes(vat);
    let matchDate = true;
    if (from || to) {
      const d = s.invoiceDate ? new Date(s.invoiceDate) : null;
      if (d) {
        if (from) matchDate = matchDate && d >= new Date(from);
        if (to) matchDate = matchDate && d <= new Date(to + 'T23:59:59');
      } else matchDate = false;
    }
    return matchSupplier && matchVat && matchDate;
  });

  renderHistoryTable(filtered);
}

function deleteScan(id) {
  if (!confirm('Delete this invoice from history?')) return;
  const idx = scans.findIndex(s => s.id === id);
  if (idx > -1) {
    scans.splice(idx, 1);
    save();
    updateBadge();
    filterTable();
  }
}

function clearAllHistory() {
  if (!confirm(`Clear ALL ${scans.length} invoices? This cannot be undone.`)) return;
  scans.length = 0;
  save();
  updateBadge();
  filterTable();
}

// Export functions
function exportExcel() {
  // Same robust Excel export as before, using the new fields
  const wb = XLSX.utils.book_new();
  const data = scans.map((s,i) => [
    i+1, 
    s.invoiceDate ? new Date(s.invoiceDate).toLocaleString('en-SA') : '',
    s.sellerName,
    s.invoiceNo,
    s.vatNo,
    s.subtotal,
    s.vatAmt,
    s.total,
    s.phase
  ]);

  const ws = XLSX.utils.aoa_to_sheet([ 
    ['#','Invoice Date','Supplier Name','Invoice Number','Supplier Tax No.','Amount Before Tax','Tax Amount','Total Incl. Tax','Phase'],
    ...data 
  ]);
  XLSX.utils.book_append_sheet(wb, 'Eman Bakery Invoices', ws);
  XLSX.writeFile(wb, `EmanBakery_Invoices_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('✅ Excel exported successfully');
}

function exportCSV() {
  let csv = 'Invoice Date,Supplier Name,Invoice Number,Supplier Tax No.,Amount Before Tax,Tax Amount,Total Incl. Tax,Phase\n';
  scans.forEach(s => {
    csv += `"${s.invoiceDate || ''}","${s.sellerName || ''}","${s.invoiceNo || ''}","${s.vatNo || ''}","${s.subtotal || ''}","${s.vatAmt || ''}","${s.total || ''}","${s.phase || ''}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `EmanBakery_Invoices_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
  toast('✅ CSV exported');
}

// Init
function init() {
  updateBadge();
  listCams();
  renderHistoryTable();   // Initial render
  // Switch to history tab by default after load if you want
  // switchTab('exp', document.querySelectorAll('.tab')[3]);
}
window.onload = init;

// Keep all other functions from previous version (camera, upload, deepScanImage, etc.)
</script>
</body>
</html>
