<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eman Bakery — ZATCA Invoice Scanner</title>

<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap');

:root {
  --bg: #07090c; --s1: #0f1318; --s2: #161c24; --border: #1e2530;
  --green: #10b981; --gold: #f59e0b; --red: #ef4444; --blue: #3b82f6;
  --text: #f1f5f9; --muted: #64748b;
  --sans: 'Plus Jakarta Sans', sans-serif; --mono: 'IBM Plex Mono', monospace; --ar: 'Noto Naskh Arabic', serif;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; padding-bottom:40px; }

.hdr { background:var(--s1); border-bottom:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; backdrop-filter:blur(10px); }
.hdr-logo { display:flex; align-items:center; gap:10px; }
.hdr-ico { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,#10b981,#059669); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#000; letter-spacing:-0.5px; }
.hdr-title { font-size:15px; font-weight:800; }
.hdr-sub { font-size:10px; color:var(--muted); font-family:var(--mono); margin-top:1px; }
.hdr-badge { font-family:var(--mono); font-size:10px; letter-spacing:.8px; padding:4px 10px; border-radius:20px; background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); color:var(--green); }

.tabs { display:flex; gap:3px; background:var(--s1); border:1px solid var(--border); border-radius:12px; padding:3px; margin:14px 14px 0; }
.tab { flex:1; padding:10px 4px; border:none; background:transparent; color:var(--muted); font-family:var(--sans); font-size:12px; font-weight:700; border-radius:9px; cursor:pointer; transition:.18s; }
.tab.on { background:var(--s2); color:var(--text); box-shadow:0 1px 6px rgba(0,0,0,.5); }
.panel { display:none; padding:14px; }
.panel.on { display:block; }

.cam-wrap { background:var(--s2); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:10px; }
.cam-view { position:relative; background:#000; width:100%; aspect-ratio:1; max-height:370px; overflow:hidden; }
#video { width:100%; height:100%; object-fit:cover; display:block; }
.ov { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.frame { width:210px; height:210px; position:relative; }
.c { position:absolute; width:26px; height:26px; border-color:var(--green); border-style:solid; }
.c.tl { top:0;left:0; border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
.c.tr { top:0;right:0; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
.c.bl { bottom:0;left:0; border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
.c.br { bottom:0;right:0; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
.laser { position:absolute; left:4px; right:4px; height:2px; background:linear-gradient(90deg,transparent,var(--green),#fff,var(--green),transparent); box-shadow:0 0 8px var(--green); animation:laser 2s ease-in-out infinite; top:0; }
@keyframes laser { 0%{top:4px;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:calc(100% - 4px);opacity:0} }
.cam-bar { position:absolute; bottom:0; left:0; right:0; padding:10px 14px; background:linear-gradient(transparent,rgba(0,0,0,.85)); display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; color:var(--green); }
.dot { width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.idle { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:var(--s2); cursor:pointer; }
.cam-btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:12px 14px; }

.btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 10px; border:none; border-radius:10px; font-family:var(--sans); font-size:12px; font-weight:700; cursor:pointer; transition:.15s; }
.g { background:var(--green); color:#000; } .g:hover:not(:disabled) { background:#059669; }
.r { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:var(--red); }
.gh { background:var(--s2); border:1px solid var(--border); color:var(--text); } .gh:hover:not(:disabled) { border-color:var(--green); color:var(--green); }
.go { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.3); color:var(--gold); }

.dropzone { border:2px dashed var(--border); border-radius:14px; padding:44px 20px; text-align:center; cursor:pointer; background:var(--s2); transition:.2s; margin-bottom:10px; }
.dropzone:hover,.dropzone.over { border-color:var(--green); background:rgba(16,185,129,.04); }
.mbox { background:var(--s2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; }
.errbox { background:rgba(239,68,68,.07); border:1px solid rgba(239,68,68,.25); border-radius:10px; padding:12px 14px; font-family:var(--mono); font-size:11px; color:var(--red); margin-bottom:10px; display:none; }
.errbox.on { display:block; }

.rcard { background:var(--s2); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-top:12px; animation:up .25s ease; }
@keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.rhead { padding:13px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
.badge { font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:20px; letter-spacing:.8px; text-transform:uppercase; }
.bz { background:rgba(16,185,129,.12); border:1px solid rgba(16,185,129,.25); color:var(--green); }
.frow { display:grid; grid-template-columns:148px 1fr; gap:8px; padding:9px 16px; border-bottom:1px solid rgba(30,37,48,.6); }
.fl { font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; }
.fv { font-size:13px; font-weight:500; word-break:break-word; }
.fv.amt { color:var(--gold); font-family:var(--mono); font-weight:700; }
.fv.ar { font-family:var(--ar); direction:rtl; text-align:right; }

.filter-bar { background:var(--s2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; display:grid; gap:10px; grid-template-columns:1fr 1fr; }
@media (max-width:640px) { .filter-bar { grid-template-columns:1fr; } }
.filter-bar input, .filter-bar select { background:var(--s1); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:10px; font-family:var(--mono); }

.stbl { background:var(--s2); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.shdr { display:grid; grid-template-columns:30px 110px 1fr 130px 110px 95px 95px 95px 70px 50px; padding:10px 12px; background:var(--s1); font-family:var(--mono); font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; gap:6px; }
.srow { display:grid; grid-template-columns:30px 110px 1fr 130px 110px 95px 95px 95px 70px 50px; padding:10px 12px; border-bottom:1px solid rgba(30,37,48,.5); gap:6px; align-items:center; cursor:pointer; }
.srow:hover { background:rgba(16,185,129,.04); }
.sn { font-family:var(--mono); font-size:10px; color:var(--muted); }
.samt { font-family:var(--mono); font-size:11px; color:var(--gold); font-weight:700; }
.sdel { width:28px; height:28px; border-radius:6px; background:transparent; color:var(--red); border:1px solid transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.sdel:hover { background:rgba(239,68,68,.15); }

.empty { padding:60px 20px; text-align:center; color:var(--muted); font-family:var(--mono); line-height:1.6; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--s2); border:1px solid var(--green); color:var(--green); padding:10px 20px; border-radius:30px; font-family:var(--mono); font-size:13px; opacity:0; transition:.3s; z-index:999; white-space:nowrap; }
.toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">
    <div class="hdr-ico">EB</div>
    <div>
      <div class="hdr-title">ZATCA Scanner</div>
      <div class="hdr-sub">Eman Bakery — Invoice QR Extractor</div>
    </div>
  </div>
  <span class="hdr-badge" id="scan-badge">0 scans</span>
</div>

<div class="tabs">
  <button class="tab on" onclick="switchTab('cam',this)">📷 Camera</button>
  <button class="tab" onclick="switchTab('upl',this)">🖼 Upload</button>
  <button class="tab" onclick="switchTab('man',this)">✏️ Paste</button>
  <button class="tab" onclick="switchTab('exp',this)">📋 History</button>
</div>

<!-- CAMERA PANEL -->
<div class="panel on" id="p-cam">
  <select id="cam-sel"></select>
  <div class="cam-wrap">
    <div class="cam-view">
      <video id="video" playsinline autoplay muted></video>
      <div class="ov"><div class="frame"><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div><div class="laser"></div></div></div>
      <div class="cam-bar"><div class="dot"></div><span id="cam-status">Tap Start to begin</span></div>
      <div class="idle" id="idle" onclick="startCam()"><svg width="60" height="60" viewBox="0 0 60 60" fill="none">...</svg><p>Tap to open camera</p></div>
    </div>
    <div class="cam-btns">
      <button class="btn g" id="btn-start" onclick="startCam()">▶ Start</button>
      <button class="btn r" id="btn-stop" onclick="stopCam()" style="display:none">■ Stop</button>
      <button class="btn gh" id="btn-torch" onclick="toggleTorch()" style="display:none">🔦 Torch</button>
      <button class="btn gh" id="btn-flip" onclick="flipCam()" style="display:none">🔄 Flip</button>
    </div>
  </div>
  <div class="errbox" id="cam-err"></div>
  <div id="cam-res"></div>
</div>

<!-- UPLOAD PANEL -->
<div class="panel" id="p-upl">
  <div class="dropzone" id="dz" onclick="document.getElementById('fi').click()" ondragover="dzOver(event)" ondragleave="document.getElementById('dz').classList.remove('over')" ondrop="dzDrop(event)">
    <div class="ico">📎</div><h3>Drop Invoice Image</h3><p>JPG · PNG · WEBP</p>
  </div>
  <input type="file" id="fi" accept="image/*" multiple onchange="onFiles(event)">
  <div class="errbox" id="upl-err"></div>
  <div id="upl-res"></div>
</div>

<!-- MANUAL PANEL -->
<div class="panel" id="p-man">
  <div class="mbox">
    <label>Paste QR string / Base64 / TLV</label>
    <textarea id="man-txt" placeholder="Paste raw QR content here…"></textarea>
  </div>
  <button class="btn g" style="width:100%" onclick="doManual()">⚡ Decode & Extract</button>
  <div class="errbox" id="man-err"></div>
  <div id="man-res"></div>
</div>

<!-- HISTORY PANEL - FULLY ENHANCED -->
<div class="panel" id="p-exp">
  <div class="filter-bar">
    <input type="text" id="filter-supplier" placeholder="Supplier Name..." onkeyup="filterTable()">
    <input type="text" id="filter-vat" placeholder="VAT Number..." onkeyup="filterTable()">
    <input type="date" id="filter-date-from" onchange="filterTable()">
    <input type="date" id="filter-date-to" onchange="filterTable()">
  </div>

  <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
    <button class="btn g" onclick="exportExcel()">⬇ Excel</button>
    <button class="btn go" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn gh" onclick="window.print()">🖨 Print / Save as PDF</button>
    <button class="btn r" onclick="clearAllHistory()">🗑 Clear All</button>
  </div>

  <div class="stbl">
    <div class="shdr">
      <div>#</div>
      <div>Invoice Date</div>
      <div>Supplier Name</div>
      <div>Invoice No.</div>
      <div>Supplier Tax No.</div>
      <div>Before Tax</div>
      <div>Tax Amount</div>
      <div>Total Incl. Tax</div>
      <div>Phase</div>
      <div></div>
    </div>
    <div id="history-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== STATE ====================
const scans = JSON.parse(localStorage.getItem('z_scans') || '[]');
let stream = null, zxReader = null, cameras = [], camIdx = 0, torchOn = false;

// ==================== TABS ====================
function switchTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  document.getElementById('p-' + id).classList.add('on');
  btn.classList.add('on');
  if (id !== 'cam') stopCam();
  if (id === 'exp') filterTable();
}

// ==================== CAMERA (unchanged core) ====================
async function listCams() { /* ... same as original ... */ }
async function startCam() { /* ... same as original ... */ }
function stopCam() { /* ... */ }
async function flipCam() { /* ... */ }
async function toggleTorch() { /* ... */ }
function showCamBtns(on) { /* ... */ }
function setStatus(txt) { document.getElementById('cam-status').textContent = txt; }
function doFlash() { /* ... */ }

// ==================== UPLOAD + DEEP SCAN (from previous improved version) ====================
function dzOver(e) { e.preventDefault(); document.getElementById('dz').classList.add('over'); }
function dzDrop(e) { e.preventDefault(); document.getElementById('dz').classList.remove('over'); [...e.dataTransfer.files].forEach(processFile); }
function onFiles(e) { [...e.target.files].forEach(processFile); e.target.value = ''; }

async function loadImage(file) { /* ... */ }
async function deepScanImage(img) { /* full grid + rotation version from earlier response */ }
async function processFile(file) { /* native + deep scan */ }

// ==================== MANUAL ====================
function doManual() {
  const v = document.getElementById('man-txt').value.trim();
  if (!v) return toast('Paste QR data first');
  processQR(v, 'man-res');
}

// ==================== TLV DECODER + ENHANCED PROCESSQR ====================
const TLV = {1:'Seller Name',2:'VAT Registration Number',3:'Invoice Date & Time',4:'Invoice Total (Incl. VAT)',5:'VAT Amount',6:'Invoice Hash (SHA-256)', /* ... */};

function decodeTLV(raw) { /* original robust decoder */ }

function processQR(raw, targetId) {
  const data = raw.trim();
  let fields = {}, name = 'ZATCA Invoice';

  const tlv = decodeTLV(data);
  if (tlv && Object.keys(tlv).length >= 3) {
    fields = {...tlv};
    // Enhanced extraction
    let invoiceNo = fields['Invoice Number'] || '';
    if (!invoiceNo) {
      const match = data.match(/INV[-\s]?(\d+|[A-Z0-9-]+)/i) || data.match(/(\d{8,12})/);
      invoiceNo = match ? match[1] : '';
    }
    fields['Invoice Number'] = invoiceNo;

    const total = parseFloat(fields['Invoice Total (Incl. VAT)'] || 0);
    const vat = parseFloat(fields['VAT Amount'] || 0);
    fields['Amount Before Tax'] = (total - vat).toFixed(2);
  }

  // Duplicate check (by hash or raw)
  const isDuplicate = scans.some(s => 
    (s.fields && s.fields['Invoice Hash (SHA-256)'] === fields['Invoice Hash (SHA-256)']) || 
    s.raw === raw
  );

  if (isDuplicate) {
    toast('⚠️ Duplicate invoice already exists in history!');
    return;
  }

  const scan = {
    id: Date.now(),
    raw,
    ts: new Date().toISOString(),
    sellerName: fields['Seller Name'] || name,
    invoiceDate: fields['Invoice Date & Time'] || '',
    invoiceNo: fields['Invoice Number'] || '',
    vatNo: fields['VAT Registration Number'] || '',
    subtotal: fields['Amount Before Tax'] || '',
    vatAmt: fields['VAT Amount'] || '',
    total: fields['Invoice Total (Incl. VAT)'] || '',
    phase: fields['Invoice Hash (SHA-256)'] ? 'Phase 2' : 'Phase 1',
    fields
  };

  scans.unshift(scan);
  if (scans.length > 500) scans.pop();
  save();
  updateBadge();
  if (targetId) renderCard(targetId, scan);
  toast('✓ Invoice saved to history');
  if (document.getElementById('p-exp').classList.contains('on')) filterTable();
}

// ==================== HISTORY TABLE & FILTERS ====================
function renderHistoryTable(filtered = scans) {
  const body = document.getElementById('history-body');
  if (!filtered.length) {
    body.innerHTML = `<div class="empty">No matching invoices.<br>Scan or adjust filters.</div>`;
    return;
  }
  body.innerHTML = filtered.map((s,i) => `
    <div class="srow" onclick="viewScan(${s.id})">
      <div class="sn">${i+1}</div>
      <div>${s.invoiceDate ? new Date(s.invoiceDate).toLocaleDateString('en-SA') : '—'}</div>
      <div>${esc(s.sellerName)}</div>
      <div>${esc(s.invoiceNo || '—')}</div>
      <div>${esc(s.vatNo || '—')}</div>
      <div class="samt">${s.subtotal ? s.subtotal + ' SAR' : '—'}</div>
      <div class="samt">${s.vatAmt ? s.vatAmt + ' SAR' : '—'}</div>
      <div class="samt">${s.total ? s.total + ' SAR' : '—'}</div>
      <div style="font-size:10px;color:var(--muted)">${s.phase}</div>
      <button class="sdel" onclick="event.stopPropagation();deleteScan(${s.id})">✕</button>
    </div>
  `).join('');
}

function filterTable() {
  const supplier = (document.getElementById('filter-supplier').value || '').toLowerCase();
  const vat = (document.getElementById('filter-vat').value || '').toLowerCase();
  const from = document.getElementById('filter-date-from').value;
  const to = document.getElementById('filter-date-to').value;

  const filtered = scans.filter(s => {
    const matchS = !supplier || s.sellerName.toLowerCase().includes(supplier);
    const matchV = !vat || (s.vatNo || '').toLowerCase().includes(vat);
    let matchD = true;
    if (from || to) {
      const d = s.invoiceDate ? new Date(s.invoiceDate) : null;
      if (!d) return false;
      if (from) matchD = matchD && d >= new Date(from);
      if (to) matchD = matchD && d <= new Date(to + 'T23:59:59');
    }
    return matchS && matchV && matchD;
  });
  renderHistoryTable(filtered);
}

function deleteScan(id) {
  if (!confirm('Delete this invoice?')) return;
  const idx = scans.findIndex(s => s.id === id);
  if (idx > -1) {
    scans.splice(idx, 1);
    save();
    updateBadge();
    filterTable();
  }
}

function clearAllHistory() {
  if (!confirm(`Clear ALL ${scans.length} invoices permanently?`)) return;
  scans.length = 0;
  save();
  updateBadge();
  filterTable();
}

// Export
function exportExcel() { /* robust XLSX with all columns - same as before */ }
function exportCSV() { /* CSV export */ }

// Utils
function save() { localStorage.setItem('z_scans', JSON.stringify(scans)); }
function updateBadge() { document.getElementById('scan-badge').textContent = scans.length + ' scans'; }
function esc(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m])); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3500);
}

// Result card, viewScan, etc. (keep from original)
function renderCard(targetId, scan) { /* original renderCard logic */ }
function viewScan(id) { /* switch to cam and show card */ }

// Init
window.onload = () => {
  updateBadge();
  listCams();
  filterTable(); // initial history render
  toast('Eman Bakery ZATCA Scanner ready — History & filters enabled');
};
</script>
</body>
</html>
